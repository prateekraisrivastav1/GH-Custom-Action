name: SonarQube Quality Gate Check

inputs:
  SONARQUBE_URL:
    required: true

  SONARQUBE_PROJECTNAME:
    required: true

  SONARQUBE_BRANCH:
    required: true

  SONAR_PASSWORD:
    required: true

runs:
  using: composite
  steps:
    - name: Check SonarQube Quality Gate
      shell: bash
      env:
        SONAR_URL: ${{ inputs.SONARQUBE_URL }}
        SONAR_PROJECTNAME: ${{ inputs.SONARQUBE_PROJECTNAME }}
        SONAR_BRANCH: ${{ inputs.SONARQUBE_BRANCH }}
        SONAR_PASSWORD: ${{ inputs.SONAR_PASSWORD }}
      run: |
        bash "${{ github.action_path }}/sonar-qg.sh" "$SONAR_PROJECTNAME" "$SONAR_PASSWORD"