name: SonarQube Quality Gate Check

inputs:
  sonar-url:
    required: true

  sonar-projectname:
    required: true

  sonar-branch:
    required: true

runs:
  using: composite
  steps:
    - name: Check SonarQube Quality Gate
      shell: bash
      env:
        SONAR_URL: ${{ inputs.sonar-url }}
        SONAR_PROJECTNAME: ${{ inputs.sonar-projectname }}
        SONAR_BRANCH: ${{ inputs.sonar-branch }}
      run: |
        bash "${{ github.action_path }}/sonar-qg.sh" "$SONAR_PROJECTNAME" "$SONAR_TOKEN"